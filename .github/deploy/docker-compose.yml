name: infinite-canvas

x-deploy-config:
  server-dependency-id: "__SERVER_DEPENDENCY_ID__"

services:
  server:
    image: node:20-bookworm
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    user: node
    working_dir: /app
    command:
      - sh
      - -ec
      - >-
        ./node_modules/.bin/prisma migrate deploy &&
        (node dist/prisma/seed.js || echo 'Warning: seed failed; continuing startup.' >&2) &&
        exec node dist/src/index.js
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      NODE_ENV: production
      LOG_LEVEL: info
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}"
      SESSION_COOKIE_NAME: ic_session
      SESSION_TTL_DAYS: "30"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-false}"
      DEFAULT_DAILY_CALL_LIMIT: "${DEFAULT_DAILY_CALL_LIMIT:-20}"
      USER_MAX_CONCURRENT_JOBS: "2"
      USER_MAX_CONCURRENT_VIDEO_JOBS: "1"
      QUOTA_TIMEZONE: "${QUOTA_TIMEZONE:-Asia/Tokyo}"
      PROVIDER_TIMEOUT_MS: "120000"
      PROVIDER_VIDEO_TIMEOUT_MS: "900000"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-https://minio.canvas.measurenavi.ai}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-infinite-canvas}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      UPLOAD_URL_TTL_SECONDS: "300"
      DOWNLOAD_URL_TTL_SECONDS: "3600"
      TEMP_FILE_TTL_HOURS: "24"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
      AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-preview}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./current/server:/app:ro
      - ./dependencies/__SERVER_DEPENDENCY_ID__/node_modules:/app/node_modules:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: postgres:16-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: infinite_canvas
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    restart: unless-stopped
    command: server /data --console-address=:9001
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_API_CORS_ALLOW_ORIGIN: https://canvas.measurenavi.ai
      MINIO_BROWSER_REDIRECT_URL: https://minio.canvas.measurenavi.ai/console
      S3_BUCKET: "${S3_BUCKET:-infinite-canvas}"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data:
  minio-data:

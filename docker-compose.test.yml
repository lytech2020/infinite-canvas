services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${TEST_APP_PORT:-53000}:3000"
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${TEST_API_PORT:-58787}:8787"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://infinite_canvas:integration_test@db:5432/infinite_canvas
      NODE_ENV: production
      LOG_LEVEL: warn
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_COOKIE_NAME: ic_test_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_DAYS: 30
      ADMIN_EMAIL: integration-admin@example.com
      ADMIN_PASSWORD: AdminTest123!
      REGISTRATION_OPEN: "false"
      DEFAULT_DAILY_CALL_LIMIT: 20
      DEFAULT_MONTHLY_BUDGET_USD: 10
      USER_MAX_CONCURRENT_JOBS: 2
      USER_MAX_CONCURRENT_VIDEO_JOBS: 1
      QUOTA_TIMEZONE: Asia/Tokyo
      PROVIDER_TIMEOUT_MS: 15000
      PROVIDER_VIDEO_TIMEOUT_MS: 30000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${TEST_MINIO_PORT:-59000}
      S3_REGION: us-east-1
      S3_BUCKET: infinite-canvas
      S3_ACCESS_KEY_ID: infinite_canvas
      S3_SECRET_ACCESS_KEY: integration_test
      S3_FORCE_PATH_STYLE: "true"
      UPLOAD_URL_TTL_SECONDS: 60
      DOWNLOAD_URL_TTL_SECONDS: 10
      TEMP_FILE_TTL_HOURS: 1
      AZURE_OPENAI_ENDPOINT: http://mock-provider:9999
      AZURE_OPENAI_API_KEY: mock-key
      AZURE_OPENAI_DEPLOYMENT: mock-text:text,mock-image:image,mock-video:video
      AZURE_OPENAI_API_VERSION: preview
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: integration_test
      POSTGRES_DB: infinite_canvas
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinite_canvas -d infinite_canvas"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address=:9001
    environment:
      MINIO_ROOT_USER: infinite_canvas
      MINIO_ROOT_PASSWORD: integration_test
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${TEST_MINIO_PORT:-59000}:9000"
      - "${TEST_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 infinite_canvas integration_test && mc mb --ignore-existing local/infinite-canvas"]

  mock-provider:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /mock
    command: ["node", "mock-provider.mjs"]
    volumes:
      - ./server/tests/mock-provider.mjs:/mock/mock-provider.mjs:ro
    ports:
      - "${TEST_MOCK_PORT:-59999}:9999"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9999/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  test-db-data:
  test-minio-data:

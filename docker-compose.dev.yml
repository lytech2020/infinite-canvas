# 本地开发依赖服务。后台和前端仍在宿主机用 bun run dev 启动。
services:
  db:
    image: postgres:16-alpine
    container_name: infinite-canvas-db
    environment:
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: infinite_canvas
      POSTGRES_DB: infinite_canvas
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
